<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Creations | Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'], display: ['Space Grotesk', 'sans-serif'] },
                    colors: { darkBg: '#050505', glassBorder: 'rgba(255, 255, 255, 0.08)', neonAccent: '#00f0ff' }
                }
            }
        }
    </script>
    <style>
        body { background-color: #050505; color: #fff; }
        .glass-card { background: rgba(255,255,255,0.02); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.08); border-radius: 1rem; }
        input, textarea { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); color: white; width: 100%; padding: 0.75rem; border-radius: 0.5rem; outline: none; transition: border-color 0.3s; }
        input:focus, textarea:focus { border-color: #00f0ff; }
    </style>
</head>
<body class="p-6 md:p-12 font-sans">
    <div class="max-w-4xl mx-auto">
        <div class="flex justify-between items-center mb-10">
            <h1 class="text-3xl font-display font-bold flex items-center gap-3"><i data-lucide="settings" class="text-neonAccent"></i> Portfolio Dashboard</h1>
            <a href="ai-creations.html" class="text-sm px-4 py-2 bg-white/10 hover:bg-white/20 rounded-lg transition-colors flex items-center gap-2"><i data-lucide="eye" class="w-4 h-4"></i> View Live Gallery</a>
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <div class="md:col-span-1 glass-card p-6 h-fit">
                <h2 class="text-xl font-bold mb-6 border-b border-glassBorder pb-4">Add New Creation</h2>
                <form id="add-form" class="space-y-4">
                    <div><label class="text-sm text-gray-400 mb-1 block">Video Link (Drive/YouTube)</label><input type="url" id="video-url" required placeholder="https://drive.google.com/..."></div>
                    <div><label class="text-sm text-gray-400 mb-1 block">AI Prompt Used</label><textarea id="prompt-text" required rows="4" placeholder="Enter the exact prompt..."></textarea></div>
                    <div><label class="text-sm text-gray-400 mb-1 block">Supporting Assets Link (Optional)</label><input type="url" id="assets-url" placeholder="https://..."></div>
                    <button type="submit" class="w-full bg-neonAccent text-black font-bold py-3 rounded-lg hover:bg-cyan-400 transition-colors flex items-center justify-center gap-2 mt-4"><i data-lucide="plus" class="w-4 h-4"></i> Add to Portfolio</button>
                </form>
            </div>
            
            <div class="md:col-span-2 glass-card p-6">
                <div class="flex justify-between items-center mb-6 border-b border-glassBorder pb-4">
                    <h2 class="text-xl font-bold">Manage Existing Data</h2>
                    <button onclick="exportCode()" class="text-xs bg-purple-600/20 text-purple-400 border border-purple-500/30 px-3 py-1.5 rounded hover:bg-purple-600/40 transition-colors flex items-center gap-2"><i data-lucide="code" class="w-3 h-3"></i> Get Code for Hosting</button>
                </div>
                <div id="data-list" class="space-y-3 max-h-[600px] overflow-y-auto pr-2"></div>
            </div>
        </div>
    </div>
    
    <!-- Modal for Code Export -->
    <div id="export-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="glass-card max-w-2xl w-full p-8 relative">
            <button onclick="document.getElementById('export-modal').classList.add('hidden')" class="absolute top-4 right-4 text-gray-400 hover:text-white"><i data-lucide="x"></i></button>
            <h3 class="text-xl font-bold mb-2">Publishing to GitHub / Real Web</h3>
            <p class="text-sm text-gray-400 mb-4">Local browser memory won't work when you upload the site for others. Copy this code and replace the <code>HARDCODED_DATA</code> array in your <code>ai-creations.html</code> file.</p>
            <textarea id="export-code" class="w-full h-48 font-mono text-sm bg-black p-4 rounded mb-4" readonly></textarea>
            <button onclick="copyExport()" class="bg-neonAccent text-black px-4 py-2 rounded font-bold w-full">Copy to Clipboard</button>
        </div>
    </div>

    <script>
        lucide.createIcons();
        let portfolioData = JSON.parse(localStorage.getItem('ai_portfolio_data')) || [];

        function renderList() {
            const list = document.getElementById('data-list');
            if (portfolioData.length === 0) {
                list.innerHTML = `<div class="text-center py-10 text-gray-500"><i data-lucide="database" class="w-8 h-8 mx-auto mb-2 opacity-50"></i><p>No items added yet.</p></div>`;
                lucide.createIcons();
                return;
            }
            list.innerHTML = portfolioData.map((item, index) => `
                <div class="bg-black/40 border border-white/5 rounded-lg p-4 flex gap-4 items-start group">
                    <div class="flex-grow min-w-0">
                        <p class="text-sm font-mono text-neonAccent truncate mb-1">${item.videoLink}</p>
                        <p class="text-xs text-gray-400 line-clamp-2">${item.prompt}</p>
                    </div>
                    <button onclick="deleteItem(${index})" class="text-red-500 hover:bg-red-500/20 p-2 rounded transition-colors opacity-50 group-hover:opacity-100"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                </div>
            `).join('');
            lucide.createIcons();
        }

        document.getElementById('add-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const newItem = {
                videoLink: document.getElementById('video-url').value,
                prompt: document.getElementById('prompt-text').value,
                assetsLink: document.getElementById('assets-url').value
            };
            portfolioData.unshift(newItem); // Add to top
            localStorage.setItem('ai_portfolio_data', JSON.stringify(portfolioData));
            e.target.reset();
            renderList();
        });

        function deleteItem(index) {
            if(confirm("Delete this creation?")) {
                portfolioData.splice(index, 1);
                localStorage.setItem('ai_portfolio_data', JSON.stringify(portfolioData));
                renderList();
            }
        }

        function exportCode() {
            const code = `const HARDCODED_DATA = ${JSON.stringify(portfolioData, null, 4)};`;
            document.getElementById('export-code').value = code;
            document.getElementById('export-modal').classList.remove('hidden');
            document.getElementById('export-modal').classList.add('flex');
        }

        function copyExport() {
            const txt = document.getElementById('export-code');
            txt.select();
            document.execCommand('copy');
            alert('Code copied! Paste this into ai-creations.html');
        }

        renderList();
    </script>
</body>
</html>
